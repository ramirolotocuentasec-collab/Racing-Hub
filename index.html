<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#08090d">
    <title>Racing Hub AR — F1 & MotoGP</title>
    <style>
        :root {
            --primary-f1: #e10600;
            --primary-motogp: #ff6600;
            --primary-current: #e10600;
            --bg-dark: #08090d;
            --card-bg: #12141c;
            --card-border: #1f2333;
            --text-main: #ffffff;
            --text-muted: #8e94a7;
            --accent-green: #00e676;
            --accent-gold: #ffc107;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 50px; -webkit-tap-highlight-color: transparent; }

        /* Header Principal */
        header {
            background: rgba(18, 20, 28, 0.95);
            backdrop-filter: blur(10px);
            padding: 14px 16px;
            text-align: center;
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-brand { font-size: 20px; font-weight: 900; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .header-brand .highlight { color: var(--primary-current); transition: color 0.3s ease; }
        .header-sub { font-size: 11px; color: var(--text-muted); margin-top: 3px; font-weight: 500; }

        /* Selector de Deportes */
        .sport-selector {
            display: flex;
            background: #141722;
            margin: 12px 16px;
            border-radius: 12px;
            padding: 4px;
            border: 1px solid var(--card-border);
        }
        .sport-btn {
            flex: 1;
            padding: 11px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 800;
            font-size: 13px;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .sport-btn.active-f1 { background: var(--primary-f1); color: #fff; box-shadow: 0 4px 14px rgba(225, 6, 0, 0.4); }
        .sport-btn.active-motogp { background: var(--primary-motogp); color: #fff; box-shadow: 0 4px 14px rgba(255, 102, 0, 0.4); }

        /* Navegación por Pestañas */
        .tab-nav {
            display: flex;
            justify-content: space-around;
            background: #0d0f17;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 14px;
            padding: 0 8px;
            overflow-x: auto;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 12px 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }
        .tab-btn.active { color: #fff; border-bottom-color: var(--primary-current); }

        .container { padding: 0 16px; }

        /* Hero: Próximo GP + Cuenta Regresiva */
        .hero-gp {
            background: linear-gradient(135deg, #181c2b 0%, #10121a 100%);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--card-border);
            position: relative;
            overflow: hidden;
        }
        .hero-gp::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: var(--primary-current);
        }
        .hero-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent-gold); font-weight: 800; margin-bottom: 4px; }
        .hero-title { font-size: 18px; font-weight: 900; margin-bottom: 10px; }
        
        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin: 12px 0;
            text-align: center;
        }
        .cd-box {
            background: #090a10;
            padding: 8px 4px;
            border-radius: 8px;
            border: 1px solid #1a1d2d;
        }
        .cd-num { font-size: 18px; font-weight: 900; color: #fff; }
        .cd-txt { font-size: 9px; color: var(--text-muted); text-transform: uppercase; margin-top: 2px; }

        /* Barra de Búsqueda y Filtros */
        .search-filter-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
        .search-input {
            width: 100%;
            background: #121520;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 10px 14px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .search-input:focus { border-color: var(--primary-current); }
        .pills-group { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
        .pill {
            background: #12141d;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .pill.active { background: #222638; color: #fff; border-color: #3b425e; }

        /* Tarjeta de Carrera */
        .card {
            background: var(--card-bg);
            border-radius: 14px;
            margin-bottom: 16px;
            border: 1px solid var(--card-border);
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        .card.is-next { border: 2px solid var(--accent-gold); }
        .card-header {
            padding: 12px 14px;
            background: #171a26;
            font-weight: 800;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
        }
        .card-body { padding: 14px; }
        .badge {
            font-size: 9px;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }
        .badge-next { background: var(--accent-gold); color: #000; }
        .badge-upcoming { background: #232738; color: var(--text-muted); }
        .badge-past { background: #141620; color: #50556b; }

        .tv-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .tv-tag { background: #1a1e2d; color: var(--accent-green); font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(0,230,118,0.2); }

        /* Lista de Sesiones */
        .session-list {
            background: #0a0b12;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 12px;
            border: 1px solid #1a1d2c;
        }
        .session-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 0;
            font-size: 12px;
            border-bottom: 1px solid #141622;
        }
        .session-item:last-child { border-bottom: none; }
        .session-title { color: #d1d5e4; font-weight: 600; }
        .session-time { color: var(--accent-gold); font-weight: 700; }
        .session-main { font-size: 13px; font-weight: 800; color: #fff; }

        .btn-group { display: flex; gap: 8px; }
        .btn-action {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
