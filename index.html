<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RacingHub AR</title>

<style>
:root{
  --bg:#07090d;
  --bg2:#0c1017;
  --card:#10151d;
  --card2:#151b25;
  --border:#242c38;
  --text:#f4f6fa;
  --muted:#9ca6b6;
  --muted2:#707b8d;
  --red:#ed1c24;
  --red2:#ff3038;
  --orange:#ff9800;
  --blue:#76a9d8;
  --shadow:0 12px 35px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at top,rgba(45,55,75,.12),transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

button,
a{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

/* =========================
   HEADER
========================= */

.header{
  padding:28px 22px 20px;
  border-bottom:1px solid #1b222d;
  background:
    linear-gradient(180deg,#090c12 0%,#07090d 100%);
}

.brand{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:36px;
  font-weight:900;
  letter-spacing:-1.5px;
}

.brand .racing{
  color:var(--red);
}

.brand .hub{
  color:#fff;
}

.brand-icon{
  font-size:27px;
}

.subtitle{
  color:#9fa8b8;
  margin-top:5px;
  font-size:17px;
}

.sport-selector{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-top:25px;
}

.sport-btn{
  min-height:78px;
  border-radius:20px;
  border:1px solid #26303d;
  background:#11161f;
  color:#aeb7c6;
  font-size:22px;
  font-weight:800;
  transition:.2s;
}

.sport-btn.active{
  color:white;
  border-color:var(--red);
  background:
    linear-gradient(135deg,rgba(237,28,36,.18),rgba(237,28,36,.04));
  box-shadow:
    inset 0 0 25px rgba(237,28,36,.07),
    0 0 20px rgba(237,28,36,.05);
}

/* =========================
   NAV
========================= */

.nav{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-bottom:1px solid #1d2530;
  background:#0c1017;
  position:sticky;
  top:0;
  z-index:50;
}

.nav button{
  position:relative;
  border:0;
  background:transparent;
  color:#929cad;
  min-height:70px;
  font-size:16px;
  font-weight:700;
}

.nav button.active{
  color:#fff;
}

.nav button.active::after{
  content:"";
  position:absolute;
  left:12%;
  right:12%;
  bottom:0;
  height:3px;
  background:var(--red);
  border-radius:4px 4px 0 0;
  box-shadow:0 0 12px rgba(237,28,36,.45);
}

.nav-icon{
  display:block;
  font-size:21px;
  margin-bottom:4px;
}

/* =========================
   MAIN
========================= */

main{
  max-width:1250px;
  margin:0 auto;
  padding:24px 22px 60px;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.section-title{
  font-size:23px;
  color:#aab3c1;
  font-weight:700;
  margin:5px 0 18px;
}

/* =========================
   NEXT GP HERO
========================= */

.next-hero{
  position:relative;
  overflow:hidden;
  min-height:650px;
  border-radius:26px;
  border:1px solid #27303d;
  background:#10151d;
  box-shadow:var(--shadow);
  isolation:isolate;
}

.next-hero-bg{
  position:absolute;
  inset:0;
  z-index:-3;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  transform:scale(1.015);
  transition:background-image .4s ease;
}

.next-hero-overlay{
  position:absolute;
  inset:0;
  z-index:-2;
  background:
    linear-gradient(
      90deg,
      rgba(4,7,11,.97) 0%,
      rgba(4,7,11,.88) 28%,
      rgba(4,7,11,.68) 53%,
      rgba(4,7,11,.36) 100%
    ),
    linear-gradient(
      0deg,
      rgba(4,7,11,.96) 0%,
      rgba(4,7,11,.10) 65%
    );
}

.next-hero-content{
  padding:38px;
  min-height:650px;
  display:flex;
  flex-direction:column;
}

.next-top{
  display:flex;
  align-items:center;
  gap:14px;
  color:#c8d0dc;
  font-size:17px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.next-logo{
  font-size:30px;
}

.next-title{
  font-size:clamp(48px,7vw,82px);
  line-height:.95;
  font-weight:950;
  letter-spacing:-2px;
  margin:18px 0 10px;
  text-transform:uppercase;
  text-shadow:0 3px 18px rgba(0,0,0,.5);
}

.next-circuit{
  display:flex;
  align-items:center;
  gap:10px;
  color:#d7dde7;
  font-size:21px;
  font-weight:600;
}

.next-country{
  font-size:27px;
}

.next-date{
  display:flex;
  flex-direction:column;
  gap:9px;
  margin-top:22px;
}

.next-date-line{
  display:flex;
  align-items:center;
  gap:11px;
  font-size:19px;
  color:#d2d8e1;
}

.next-time{
  color:var(--orange);
  font-size:31px;
  font-weight:900;
}

.next-time small{
  color:#ddd;
  font-size:16px;
  font-weight:700;
}

.next-info-grid{
  display:grid;
  grid-template-columns:minmax(300px,1fr) minmax(300px,1fr);
  gap:24px;
  margin-top:28px;
  flex:1;
  align-items:end;
}

.countdown{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  padding:11px;
  border:1px solid rgba(70,86,108,.75);
  background:rgba(6,12,20,.72);
  backdrop-filter:blur(7px);
  border-radius:18px;
}

.count-box{
  text-align:center;
  padding:18px 8px;
  border-radius:12px;
  background:rgba(8,17,29,.92);
  border:1px solid rgba(34,47,64,.8);
}

.count-number{
  display:block;
  font-size:31px;
  font-weight:900;
}

.count-label{
  display:block;
  color:#9ba6b7;
  font-size:12px;
  font-weight:800;
  margin-top:4px;
}

.sessions{
  padding:18px 20px;
  border-left:3px solid var(--orange);
  background:rgba(5,10,16,.60);
  backdrop-filter:blur(6px);
  border-radius:0 15px 15px 0;
}

.sessions-title{
  font-size:16px;
  font-weight:900;
  margin-bottom:13px;
  letter-spacing:.4px;
}

.session-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  padding:5px 0;
  color:#d4dae3;
  font-size:14px;
}

.session-time{
  color:var(--orange);
  font-weight:900;
  white-space:nowrap;
}

.hero-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:25px;
}

.action-btn{
  border-radius:12px;
  min-height:51px;
  border:1px solid #344052;
  background:#101923d9;
  color:#fff;
  font-weight:800;
}

.action-btn.primary{
  border-color:var(--red);
  background:linear-gradient(135deg,#ed1c24,#c90f17);
}

/* =========================
   GENERIC CARDS
========================= */

.card{
  background:linear-gradient(180deg,#11161e,#0e131a);
  border:1px solid var(--border);
  border-radius:24px;
  padding:25px;
  margin-bottom:22px;
  box-shadow:0 8px 25px rgba(0,0,0,.15);
}

.card-title{
  color:#a9b2c1;
  font-size:20px;
  text-transform:uppercase;
  letter-spacing:.4px;
  margin-bottom:20px;
}

.empty{
  padding:60px 20px;
  text-align:center;
  color:#929cad;
  font-size:21px;
}

/* =========================
   CALENDAR
========================= */

.race-card{
  display:flex;
  justify-content:space-between;
  gap:18px;
  padding:18px 0;
  border-bottom:1px solid #202733;
}

.race-card:last-child{
  border-bottom:0;
}

.race-main{
  min-width:0;
}

.race-round{
  color:var(--red);
  font-weight:900;
  font-size:13px;
}

.race-name{
  font-size:21px;
  font-weight:900;
  margin:4px 0;
}

.race-circuit{
  color:#9ca6b6;
}

.race-date{
  color:#dbe0e8;
  font-weight:700;
  text-align:right;
  white-space:nowrap;
}

/* =========================
   STANDINGS
========================= */

.standings-table{
  width:100%;
  border-collapse:collapse;
}

.standings-table th{
  text-align:left;
  color:#727d8e;
  font-size:12px;
  padding:10px 8px;
  text-transform:uppercase;
}

.standings-table td{
  padding:13px 8px;
  border-top:1px solid #202733;
  font-size:15px;
}

.standings-table td:last-child,
.standings-table th:last-child{
  text-align:right;
}

.position{
  width:40px;
  color:#8994a5;
  font-weight:800;
}

/* =========================
   MACHINES
========================= */

.machines{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.machine{
  overflow:hidden;
  border-radius:18px;
  border:1px solid #27303d;
  background:#0d1219;
}

.machine-image{
  height:210px;
  background:
    radial-gradient(circle,#202b3b,#0b1016 70%);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.machine-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.machine-placeholder{
  font-size:58px;
  opacity:.5;
}

.machine-info{
  padding:16px;
}

.machine-name{
  font-size:18px;
  font-weight:900;
}

.machine-team{
  color:#8f99a9;
  margin-top:5px;
}

/* =========================
   NEWS
========================= */

.news-list{
  display:grid;
  gap:13px;
}

.news-item{
  display:grid;
  grid-template-columns:145px 1fr;
  gap:15px;
  padding:12px;
  border:1px solid #252e3b;
  border-radius:17px;
  background:#0e141c;
  transition:.2s;
}

.news-item:hover{
  border-color:#3a4556;
  transform:translateY(-1px);
}

.news-image{
  width:145px;
  height:95px;
  border-radius:12px;
  overflow:hidden;
  background:
    linear-gradient(135deg,#171f2b,#0a0e14);
  display:flex;
  align-items:center;
  justify-content:center;
}

.news-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.news-placeholder{
  font-size:36px;
  opacity:.7;
}

.news-title{
  font-size:16px;
  font-weight:800;
  line-height:1.3;
}

.news-meta{
  margin-top:8px;
  color:#788496;
  font-size:12px;
}

/* =========================
   LOADING
========================= */

.loading{
  min-height:180px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#8792a3;
  font-size:18px;
}

.spinner{
  width:24px;
  height:24px;
  border:3px solid #27303b;
  border-top-color:var(--red);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin-right:10px;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){

  .header{
    padding:25px 18px 18px;
  }

  .brand{
    font-size:31px;
  }

  .subtitle{
    font-size:15px;
  }

  .sport-btn{
    min-height:65px;
    font-size:18px;
  }

  main{
    padding:18px 14px 45px;
  }

  .next-hero{
    min-height:760px;
    border-radius:21px;
  }

  .next-hero-content{
    min-height:760px;
    padding:25px 20px 20px;
  }

  .next-hero-overlay{
    background:
      linear-gradient(
        90deg,
        rgba(4,7,11,.94) 0%,
        rgba(4,7,11,.78) 100%
      ),
      linear-gradient(
        0deg,
        rgba(4,7,11,.98) 0%,
        rgba(4,7,11,.20) 75%
      );
  }

  .next-title{
    font-size:52px;
  }

  .next-circuit{
    font-size:17px;
  }

  .next-info-grid{
    grid-template-columns:1fr;
    gap:15px;
    margin-top:25px;
    align-items:initial;
  }

  .count-number{
    font-size:24px;
  }

  .count-label{
    font-size:10px;
  }

  .sessions{
    padding:15px;
  }

  .hero-actions{
    grid-template-columns:1fr;
  }

  .race-card{
    flex-direction:column;
  }

  .race-date{
    text-align:left;
  }

  .machines{
    grid-template-columns:1fr;
  }

  .news-item{
    grid-template-columns:105px 1fr;
  }

  .news-image{
    width:105px;
    height:82px;
  }

  .news-title{
    font-size:14px;
  }
}

@media(max-width:480px){

  .nav button{
    font-size:12px;
  }

  .nav-icon{
    font-size:18px;
  }

  .brand{
    font-size:27px;
  }

  .brand-icon{
    font-size:21px;
  }

  .sport-selector{
    gap:8px;
  }

  .sport-btn{
    font-size:15px;
    min-height:58px;
  }

  .next-title{
    font-size:45px;
  }

  .next-time{
    font-size:27px;
  }

  .countdown{
    gap:5px;
    padding:7px;
  }

  .count-box{
    padding:13px 4px;
  }

  .count-number{
    font-size:21px;
  }

  .session-row{
    font-size:12px;
  }

  .news-item{
    grid-template-columns:90px 1fr;
    gap:10px;
  }

  .news-image{
    width:90px;
    height:76px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="brand">
    <span class="brand-icon">🏎️</span>
    <span class="racing">RACING</span><span class="hub">HUB</span>
    <span class="brand-icon">🏍️</span>
  </div>

  <div class="subtitle">
    F1 + MotoGP · Horarios de Argentina
  </div>

  <div class="sport-selector">

    <button
      id="sportF1"
      class="sport-btn active"
      onclick="setSport('f1')">

    <button
      id="sportMoto"
      class="sport-btn"
      onclick="setSport('moto')">

    </button>

</header>


<nav class="nav">

  <button
    id="navNext"
    class="active"
    onclick="setSection('next')">
    <span class="nav-icon">⏱️</span>
    Próximo GP
  </button>

  <button
    id="navCalendar"
    onclick="setSection('calendar')">

  </button>

  <button
    id="navStandings"
    onclick="setSection('standings')">

    id="navNews"
    onclick="setSection('news')">
    <span class="nav-icon">📰</span>

  </button>

</nav>


<main>

  <!-- =========================
       PRÓXIMO GP
  ========================== -->

  <section id="sectionNext" class="section active">

    <div id="nextContainer">

      <div class="loading">
        <span class="spinner"></span>
        Cargando próximo GP...
      </div>

    </div>

  </section>


  <!-- =========================
       CALENDARIO
  ========================== -->

  <section id="sectionCalendar" class="section">

    <div class="card">

      <div class="card-title">
        Calendario
      </div>

      <div id="calendarContainer">
        <div class="loading">
          <span class="spinner"></span>

    </div>

  </section>


  <!-- =========================
       CAMPEONATO
  ========================== -->

  <section id="sectionStandings" class="section">

    <div class="card">

      <div class="card-title">

      </div>

      <div id="driversContainer">
        <div class="loading">
          <span class="spinner"></span>

      </div>

    </div>


    <div class="card">

      <div class="card-title">
        Campeonato de equipos
      </div>

      <div id="teamsContainer">
        <div class="loading">
          <span class="spinner"></span>
          Cargando clasificación...

      </div>

    </div>


    <div class="card">

      <div class="card-title">
        🏍️ Las máquinas
      </div>

          <span class="spinner"></span>

  <!-- =========================

  ========================== -->

      <div class="card-title">
        Noticias
      </div>

      <div id="newsContainer">
        <div class="loading">
          <span class="spinner"></span>
          Cargando noticias...
        </div>
      </div>

    </div>

  </section>

</main>


<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const DATA_URL = "./data/current.json";

const ARGENTINA_TZ = "America/Argentina/Buenos_Aires";

let state = {
  data: null,
  sport: "f1",
  section: "next"
};


/* =========================================================
   UTILIDADES
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function escapeAttribute(value){

  return escapeHtml(value);
}


function slugify(value){

  return String(value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");
}


function getRaces(sport){

  if(!state.data || !state.data[sport]){
    return [];
  }

  return state.data[sport].races ||
         state.data[sport].events ||
         [];
}


function getSportData(){

  return state.data?.[state.sport] || {};
}


function formatDate(value){

  if(!value){
    return "Fecha no disponible";
  }

  const date = new Date(value);

  if(Number.isNaN(date.getTime())){
    return escapeHtml(value);
  }

  return new Intl.DateTimeFormat("es-AR",{
    timeZone:ARGENTINA_TZ,
    weekday:"long",
    day:"numeric",
    month:"long",
    year:"numeric"
  }).format(date);
}


function formatShortDate(value){

  if(!value){
    return "";
  }

  const date = new Date(value);

  if(Number.isNaN(date.getTime())){
    return "";
  }

  return new Intl.DateTimeFormat("es-AR",{
    timeZone:ARGENTINA_TZ,
    weekday:"short",
    day:"2-digit",
    month:"2-digit"
  }).format(date);
}


function formatTime(value){

  if(!value){
    return "--:--";
  }

  const date = new Date(value);

  if(Number.isNaN(date.getTime())){
    return "--:--";
  }

  return new Intl.DateTimeFormat("es-AR",{
    timeZone:ARGENTINA_TZ,
    hour:"2-digit",
    minute:"2-digit",
    hour12:false
  }).format(date);
}


function getNextRace(sport){

  const races = getRaces(sport);

  const now = Date.now();

  const future = races
    .filter(race => {

      const value =
        race.race ||
        race.date ||
        race.datetime;

      if(!value){
        return true;
      }

      const timestamp = new Date(value).getTime();

      return Number.isNaN(timestamp) || timestamp >= now;

    })
    .sort((a,b)=>{

      const aDate = new Date(
        a.race || a.date || a.datetime || 0
      ).getTime();

      const bDate = new Date(
        b.race || b.date || b.datetime || 0
      ).getTime();

      if(Number.isNaN(aDate)) return 1;
      if(Number.isNaN(bDate)) return -1;

      return aDate-bDate;
    });

  return future[0] || races[0] || null;
}


/* =========================================================
   BANDERAS
========================================================= */

function getCountryFlag(race){

  const country =
    String(
      race.country ||
      race.nation ||
      race.nationality ||
      ""
    ).toLowerCase();

  const circuit =
    String(
      race.circuit ||
      race.name ||
      ""
    ).toLowerCase();

  const text = country + " " + circuit;

  const flags = [

    [["argentina","argentina"],"🇦🇷"],
    [["australia","australia"],"🇦🇺"],
    [["japan","japón","japon","suzuka"],"🇯🇵"],
    [["china","shanghai"],"🇨🇳"],
    [["bahrain","sakhir"],"🇧🇭"],
    [["saudi","jeddah"],"🇸🇦"],
    [["usa","united states","america","austin","miami"],"🇺🇸"],

/* =========================================================
   IMAGEN DEL CIRCUITO
========================================================= */

/*
   Primero utiliza circuitImage si el JSON ya la tiene.

   Si no existe, consulta Wikimedia Commons.
   Esto permite que el próximo circuito cambie automáticamente
   sin tener que editar el HTML.
*/

const circuitImageCache = new Map();


function buildCircuitSearch(race){

  const name = race?.name || "";
  const circuit = race?.circuit || "";

  let query =
    circuit +
    " " +
    name +
    " racing circuit";

  if(state.sport === "moto"){
    query += " MotoGP";
  }else{
    query += " Formula 1";
  }

  return query;
}


async function findCircuitImage(race){

  if(!race){
    return "";
  }

  const direct =
    race.circuitImage ||
    race.circuit_image ||
    race.image ||
    race.imageUrl ||
    race.image_url ||
    "";

  if(direct){
    return direct;
  }

  const key =
    state.sport +
    "|" +
    (race.circuit || race.name || "");

  if(circuitImageCache.has(key)){
    return circuitImageCache.get(key);
  }

  const query = buildCircuitSearch(race);

  try{

    const url =
      "https://commons.wikimedia.org/w/api.php" +
      "?action=query" +
      "&generator=search" +
      "&gsrsearch=" +
      encodeURIComponent(query) +
      "&gsrnamespace=6" +
      "&gsrlimit=8" +
      "&prop=imageinfo" +
      "&iiprop=url" +
      "&iiurlwidth=1800" +
      "&format=json" +
      "&origin=*";

    const response = await fetch(url);

    if(!response.ok){
      throw new Error("Wikimedia HTTP " + response.status);
    }

    const json = await response.json();

    const pages =
      Object.values(json.query?.pages || {});

    /*
      Buscamos preferentemente imágenes que tengan
      palabras relacionadas con el circuito.
    */

    const circuitWords =
      String(
        race.circuit ||
        race.name ||
        ""
      )
      .toLowerCase()
      .split(/\s+/)
      .filter(word=>word.length >= 4);

    pages.sort((a,b)=>{

      const aTitle =
        String(a.title || "").toLowerCase();

      const bTitle =
        String(b.title || "").toLowerCase();

      const aScore =
        circuitWords.reduce(
          (score,word)=>
            score + (aTitle.includes(word) ? 1 : 0),
          0
        );

      const bScore =
        circuitWords.reduce(
          (score,word)=>
            score + (bTitle.includes(word) ? 1 : 0),
          0
        );

      return bScore-aScore;
    });

    const selected =
      pages.find(page =>
        page.imageinfo &&
        page.imageinfo[0] &&
        page.imageinfo[0].thumburl
      );

    const image =
      selected?.imageinfo?.[0]?.thumburl ||
      selected?.imageinfo?.[0]?.url ||
      "";

    circuitImageCache.set(key,image);

    return image;

  }catch(error){

    console.warn(
      "No se pudo obtener imagen del circuito:",
      error
    );

    circuitImageCache.set(key,"");

    return "";
  }
}

/* =========================================================
   CUENTA REGRESIVA
========================================================= */

let countdownTimer = null;


function startCountdown(dateValue,elementId){

  if(countdownTimer){
    clearInterval(countdownTimer);
  }

  const target =
    new Date(dateValue).getTime();

  const element =
    document.getElementById(elementId);

  if(
    !element ||
    Number.isNaN(target)
  ){
    return;
  }

  function update(){

    const now = Date.now();

    let difference =
      target-now;

    if(difference < 0){
      difference = 0;
    }

    const days =
      Math.floor(
        difference /
        (1000*60*60*24)
      );

    difference %= 1000*60*60*24;

    const hours =
      Math.floor(
        difference /
        (1000*60*60)
      );

    difference %= 1000*60*60;

    const minutes =
      Math.floor(
        difference /
        (1000*60)
      );

    difference %= 1000*60;

    const seconds =
      Math.floor(
        difference /
        1000
      );

    const values = [
      days,
      hours,
      minutes,
      seconds
    ];

    const boxes =
      element.querySelectorAll(
        ".count-number"
      );

    boxes.forEach((box,index)=>{

      box.textContent =
        String(values[index])
          .padStart(2,"0");

    });
  }

  update();

  countdownTimer =
    setInterval(update,1000);
}

function formatNewsDate(value){

  if(!value){
    return "";
  }

  const date =
    new Date(value);

  if(Number.isNaN(date.getTime())){
    return "";
  }

  return new Intl.DateTimeFormat("es-AR",{
    timeZone:ARGENTINA_TZ,
    day:"2-digit",
    month:"short",
    hour:"2-digit",
    minute:"2-digit",
    hour12:false
  }).format(date);
}

  Object.entries(sections)
    .forEach(([key,id])=>{

    next:"navNext",
    calendar:"navCalendar",
    standings:"navStandings",
    news:"navNews"

  Object.entries(navs)
    .forEach(([key,id])=>{

      const element =
        document.getElementById(id);

      if(element){
        element.classList.toggle(

          key === section

    renderNext();

        `${formatTime(session.date)} ART\n`;

    });
  }

  alert(text);
}


/* =========================================================
   CALENDARIO .ICS
========================================================= */

function downloadRaceCalendar(){

  const race =
    getNextRace(state.sport);

  if(!race){
    return;
  }

  const sessions =
    Array.isArray(race.sessions)
      ? race.sessions
      : [];

  const events = [];

  sessions.forEach(session=>{

    if(!session.date){
      return;
    }

    events.push({
      name:
        `${race.name || "GP"} - ` +
        `${session.name || "Sesión"}`,

      date:
        session.date
    });

  });


  if(!events.length && race.race){

    events.push({
      name:
        `${race.name || "GP"} - Carrera`,

      date:
        race.race
    });

  }


  const lines = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//RacingHub AR//ES",
    "CALSCALE:GREGORIAN"
  ];


  events.forEach((event,index)=>{

    const start =
      new Date(event.date);

    if(Number.isNaN(start.getTime())){
      return;
    }

    const end =
      new Date(
        start.getTime() +
        2*60*60*1000
      );

    const uid =
      "racinghub-" +
      state.sport +
      "-" +
      Date.now() +
      "-" +
      index +
      "@racinghub";

    lines.push(
      "BEGIN:VEVENT"
    );

    lines.push(
      "UID:" + uid
    );

    lines.push(
      "DTSTAMP:" +
      toICS(new Date())
    );

    lines.push(
      "DTSTART:" +
      toICS(start)
    );

    lines.push(
      "DTEND:" +
      toICS(end)
    );

    lines.push(
      "SUMMARY:" +
      escapeICS(event.name)
    );

    lines.push(
      "BEGIN:VALARM"
    );

    lines.push(
      "TRIGGER:-P1D"
    );

    lines.push(
      "ACTION:DISPLAY"
    );

    lines.push(
      "DESCRIPTION:" +
      escapeICS(event.name)
    );

    lines.push(
      "END:VALARM"
    );

    lines.push(
      "BEGIN:VALARM"
    );

    lines.push(
      "TRIGGER:-PT1H"
    );

    lines.push(
      "ACTION:DISPLAY"
    );

    lines.push(
      "DESCRIPTION:" +
      escapeICS(event.name)
    );

    lines.push(
      "END:VALARM"
    );

    lines.push(
      "END:VEVENT"
    );

  });


  lines.push(
    "END:VCALENDAR"
  );


  const blob =
    new Blob(
      [lines.join("\r\n")],
      {
        type:"text/calendar;charset=utf-8"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const link =
    document.createElement("a");

  link.href = url;

  link.download =
    `racinghub-${state.sport}.ics`;

  document.body.appendChild(link);

  link.click();

  link.remove();

  URL.revokeObjectURL(url);
}


function toICS(date){

  return date
    .toISOString()
    .replace(/[-:]/g,"")
    .replace(/\.\d{3}/,"");
}


function escapeICS(value){

  return String(value || "")
    .replace(/\\/g,"\\\\")
    .replace(/\n/g,"\\n")
    .replace(/,/g,"\\,")
    .replace(/;/g,"\\;");
}

   RENDER GENERAL
========================================================= */

function render(){

  renderNext();
  renderCalendar();
  renderStandings();
  renderMachines();

  if(state.section === "news"){
    loadNews();
  }
}


/* =========================================================
   CARGAR DATOS
========================================================= */

async function loadData(){

  try{

    const response =
      await fetch(
        DATA_URL +
        "?t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );

    if(!response.ok){
      throw new Error(
        "HTTP " + response.status
      );
    }

    state.data =
      await response.json();

    render();

  }catch(error){

    console.error(
      "Error cargando current.json:",
      error
    );

    document.getElementById(
      "nextContainer"
    ).innerHTML = `

      <div class="card">

        <div class="empty">

          No se pudieron cargar
          los datos deportivos.

          <br><br>

          <small>
            Verificá que
            data/current.json
            exista y que GitHub Actions
            haya actualizado los datos.
          </small>

        </div>

      </div>
    `;
  }
}


/* =========================================================
   INICIO
========================================================= */

loadData();
