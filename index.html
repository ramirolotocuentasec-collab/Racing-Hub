<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#090b10">

<title>Racing Hub AR</title>

<style>
:root{
    --bg:#090b10;
    --panel:#11151d;
    --panel2:#171c25;
    --border:#252c38;
    --text:#f4f5f7;
    --muted:#9da6b5;
    --red:#e10600;
    --orange:#ff6b00;
    --green:#28c76f;
    --blue:#4da3ff;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:
        radial-gradient(circle at top,#171b25 0,#090b10 45%);
    color:var(--text);
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    min-height:100vh;
}

button{
    font:inherit;
}

.app{
    width:100%;
    max-width:900px;
    margin:auto;
    padding-bottom:40px;
}

/* HEADER */

header{
    padding:
        calc(18px + env(safe-area-inset-top))
        18px
        16px;

    border-bottom:1px solid var(--border);

    background:rgba(9,11,16,.92);

    position:sticky;
    top:0;
    z-index:50;

    backdrop-filter:blur(14px);
}

.logo{
    font-size:24px;
    font-weight:900;
    letter-spacing:1px;
}

.logo span{
    color:var(--red);
}

.subtitle{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

/* SPORT SELECTOR */

.sports{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:15px;
}

.sport-btn{
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--muted);
    padding:12px;
    border-radius:12px;
    font-weight:800;
    cursor:pointer;
}

.sport-btn.active{
    background:linear-gradient(135deg,#281012,#17151a);
    color:white;
    border-color:#7e2424;
}

/* NAV */

nav{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;
    padding:10px 12px;
    border-bottom:1px solid var(--border);
}

.nav-btn{
    background:transparent;
    border:0;
    color:var(--muted);
    padding:9px 4px;
    font-size:12px;
    border-radius:9px;
    cursor:pointer;
}

.nav-btn.active{
    color:white;
    background:var(--panel2);
}

/* STATUS */

.status{
    margin:12px;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--panel);
    font-size:12px;
    color:var(--muted);
}

.status.ok{
    border-color:#1d633f;
    color:#7de2a7;
}

.status.error{
    border-color:#713333;
    color:#ff9999;
}

/* CONTENT */

main{
    padding:0 12px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

/* CARDS */

.card{
    background:linear-gradient(145deg,var(--panel),#0e1218);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
}

.card-title{
    font-size:13px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.7px;
    margin-bottom:10px;
}

.gp-name{
    font-size:25px;
    font-weight:900;
    margin-bottom:5px;
}

.track{
    color:var(--muted);
    font-size:13px;
}

.date{
    margin-top:15px;
    font-size:16px;
    font-weight:800;
}

.time{
    color:var(--orange);
    font-size:25px;
    font-weight:900;
    margin-top:3px;
}

/* COUNTDOWN */

.countdown{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-top:15px;
}

.time-box{
    background:#0a0d12;
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 4px;
    text-align:center;
}

.time-number{
    font-size:20px;
    font-weight:900;
}

.time-label{
    color:var(--muted);
    font-size:9px;
    margin-top:3px;
}

/* BUTTONS */

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:12px;
}

.action{
    border:1px solid var(--border);
    background:var(--panel2);
    color:white;
    padding:11px;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
}

.action.primary{
    background:linear-gradient(135deg,#a50000,#e10600);
    border-color:#e10600;
}

/* SESSION LIST */

.sessions{
    margin-top:15px;
    display:grid;
    gap:6px;
}

.session{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#0b0e14;
    border:1px solid var(--border);
    border-radius:9px;
    padding:9px 11px;
}

.session-name{
    font-size:12px;
}

.session-time{
    font-size:12px;
    color:var(--orange);
    font-weight:800;
}

/* CALENDAR */

.calendar-item{
    display:grid;
    grid-template-columns:60px 1fr auto;
    gap:10px;
    align-items:center;

    padding:12px 0;

    border-bottom:1px solid var(--border);
}

.calendar-item:last-child{
    border-bottom:0;
}

.round{
    color:var(--orange);
    font-weight:900;
    font-size:11px;
}

.calendar-name{
    font-weight:800;
    font-size:14px;
}

.calendar-date{
    color:var(--muted);
    font-size:11px;
    margin-top:3px;
}

.calendar-time{
    font-weight:900;
    font-size:13px;
}

/* STANDINGS */

.standing{
    display:grid;
    grid-template-columns:32px 1fr 55px;
    gap:8px;
    align-items:center;

    padding:10px 0;
    border-bottom:1px solid var(--border);
}

.standing:last-child{
    border-bottom:0;
}

.pos{
    color:var(--muted);
    font-weight:900;
}

.driver{
    font-weight:700;
}

.team{
    color:var(--muted);
    font-size:10px;
    margin-top:2px;
}

.points{
    text-align:right;
    font-weight:900;
}

/* NEWS */

.news{
    display:block;
    text-decoration:none;
    color:white;

    padding:13px 0;

    border-bottom:1px solid var(--border);
}

.news:last-child{
    border-bottom:0;
}

.news-title{
    font-weight:800;
    line-height:1.3;
}

.news-meta{
    color:var(--muted);
    font-size:10px;
    margin-top:5px;
}

/* EMPTY / LOADING */

.empty{
    padding:30px 15px;
    text-align:center;
    color:var(--muted);
}

.loading{
    padding:40px 10px;
    text-align:center;
    color:var(--muted);
}

.spinner{
    width:26px;
    height:26px;
    border:3px solid #303642;
    border-top-color:var(--red);
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 12px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* FOOTER */

footer{
    padding:20px;
    text-align:center;
    color:#626b78;
    font-size:10px;
}
</style>
</head>

<body>

<div class="app">

<header>

    <div class="logo">
        🏎️ <span>RACING</span>HUB 🏍️
    </div>

    <div class="subtitle">
        F1 + MotoGP · Horarios de Argentina
    </div>

    <div class="sports">
        <button
            id="f1Btn"
            class="sport-btn active"
            onclick="setSport('f1')">
            🏎️ FÓRMULA 1
        </button>

        <button
            id="motoBtn"
            class="sport-btn"
            onclick="setSport('moto')">
            🏍️ MOTOGP
        </button>
    </div>

</header>

<nav>

    <button
        class="nav-btn active"
        data-page="next"
        onclick="showPage('next')">
        Próximo GP
    </button>

    <button
        class="nav-btn"
        data-page="calendar"
        onclick="showPage('calendar')">
        Calendario
    </button>

    <button
        class="nav-btn"
        data-page="standings"
        onclick="showPage('standings')">
        Campeonato
    </button>

    <button
        class="nav-btn"
        data-page="news"
        onclick="showPage('news')">
        Noticias
    </button>

</nav>

<div id="status" class="status">
    Inicializando Racing Hub...
</div>

<main>

    <!-- PRÓXIMO GP -->

    <section
        id="page-next"
        class="page active">

        <div id="nextContent">
            <div class="loading">
                <div class="spinner"></div>
                Cargando datos...
            </div>
        </div>

    </section>

    <!-- CALENDARIO -->

    <section
        id="page-calendar"
        class="page">

        <div class="card">

            <div class="card-title">
                Calendario
            </div>

            <div id="calendarContent">
                <div class="loading">
                    Cargando...
                </div>
            </div>

            <div class="actions">

                <button
                    class="action primary"
                    onclick="syncCalendar()">
                    📅 Sincronizar calendario
                </button>

                <button
                    class="action"
                    onclick="openOfficial()">
                    🌐 Web oficial
                </button>

            </div>

        </div>

    </section>

    <!-- CAMPEONATO -->

    <section
        id="page-standings"
        class="page">

        <div class="card">

            <div class="card-title">
                Campeonato de pilotos
            </div>

            <div id="driversContent">
                <div class="loading">
                    Cargando...
                </div>
            </div>

        </div>

        <div class="card">

            <div class="card-title">
                Campeonato de equipos
            </div>

            <div id="teamsContent">
                <div class="loading">
                    Cargando...
                </div>
            </div>

        </div>

    </section>

    <!-- NOTICIAS -->

    <section
        id="page-news"
        class="page">

        <div class="card">

            <div class="card-title">
                Noticias
            </div>

            <div id="newsContent">
                <div class="loading">
                    Cargando noticias...
                </div>
            </div>

        </div>

    </section>

</main>

<footer>
    Racing Hub AR · Datos actualizados desde Internet
</footer>

</div>

<script>
"use strict";

/*
    =====================================================
    CONFIGURACIÓN
    =====================================================
*/

const DATA_URL = "./data/current.json";

const ARGENTINA_TZ =
    "America/Argentina/Buenos_Aires";

const state = {
    sport: "f1",
    page: "next",
    data: null,
    now: new Date(),
    countdownTimer: null
};


/*
    =====================================================
    ARRANQUE
    =====================================================
*/

document.addEventListener("DOMContentLoaded", () => {

    /*
       IMPORTANTE:

       La interfaz YA EXISTE antes de pedir datos.

       Si current.json falla, la página NO queda en blanco.
    */

    setStatus(
        "Cargando datos deportivos...",
        "normal"
    );

    loadData();

});


/*
    =====================================================
    DATOS
    =====================================================
*/

async function loadData(){

    try{

        const response = await fetch(
            DATA_URL + "?t=" + Date.now(),
            {
                cache:"no-store"
            }
        );

        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }

        const json = await response.json();

        if(!json){

            throw new Error(
                "El JSON está vacío"
            );

        }

        state.data = json;

        render();

        setStatus(
            "✓ Datos actualizados",
            "ok"
        );

    }catch(error){

        console.error(
            "Racing Hub:",
            error
        );

        /*
           Nunca dejamos la aplicación en blanco.
        */

        setStatus(
            "⚠️ No se pudieron cargar los datos. " +
            "La interfaz funciona, pero falta current.json.",
            "error"
        );

        showDataError(error);

    }

}


/*
    =====================================================
    RENDER GENERAL
    =====================================================
*/

function render(){

    renderNext();
    renderCalendar();
    renderStandings();

    /*
       Noticias no deben romper el resto
       de la aplicación.
    */

    loadNews();

}


/*
    =====================================================
    DEPORTE
    =====================================================
*/

function setSport(sport){

    state.sport = sport;

    document
        .getElementById("f1Btn")
        .classList.toggle(
            "active",
            sport === "f1"
        );

    document
        .getElementById("motoBtn")
        .classList.toggle(
            "active",
            sport === "moto"
        );

    render();

}


/*
    =====================================================
    NAVEGACIÓN
    =====================================================
*/

function showPage(page){

    state.page = page;

    document
        .querySelectorAll(".page")
        .forEach(el => {
            el.classList.remove("active");
        });

    document
        .getElementById(
            "page-" + page
        )
        .classList.add("active");

    document
        .querySelectorAll(".nav-btn")
        .forEach(el => {

            el.classList.toggle(
                "active",
                el.dataset.page === page
            );

        });

}


/*
    =====================================================
    PRÓXIMO GP
    =====================================================
*/

function renderNext(){

    const container =
        document.getElementById(
            "nextContent"
        );

    const races =
        getRaces();

    if(!races.length){

        container.innerHTML =
            emptyMessage(
                "No hay carreras disponibles."
            );

        return;

    }

    const now =
        new Date();

    const future =
        races
        .filter(r => {
            return new Date(r.race) > now;
        })
        .sort(
            (a,b) =>
                new Date(a.race) -
                new Date(b.race)
        );

    if(!future.length){

        container.innerHTML =
            emptyMessage(
                "No quedan carreras futuras en los datos recibidos."
            );

        return;

    }

    const race =
        future[0];

    container.innerHTML = `

        <div class="card">

            <div class="card-title">
                Próximo Gran Premio
            </div>

            <div class="gp-name">
                ${escapeHtml(race.name)}
            </div>

            <div class="track">
                ${escapeHtml(race.circuit || "Circuito no disponible")}
            </div>

            <div class="date">
                ${formatDate(race.race)}
            </div>

            <div class="time">
                ${formatTime(race.race)}
            </div>

            <div
                id="countdown"
                class="countdown">
            </div>

            <div class="sessions">

                ${renderSessions(race)}

            </div>

        </div>
    `;

    startCountdown(
        new Date(race.race)
    );

}


/*
    =====================================================
    SESIONES
    =====================================================
*/

function renderSessions(race){

    const sessions =
        race.sessions || [];

    if(!sessions.length){

        return `
            <div class="empty">
                Horarios de sesiones no disponibles.
            </div>
        `;

    }

    return sessions
        .filter(s => s.date)
        .map(s => `

            <div class="session">

                <div class="session-name">
                    ${escapeHtml(s.name)}
                </div>

                <div class="session-time">
                    ${formatDateTime(s.date)}
                </div>

            </div>

        `)
        .join("");

}


/*
    =====================================================
    CUENTA REGRESIVA
    =====================================================
*/

function startCountdown(target){

    if(state.countdownTimer){

        clearInterval(
            state.countdownTimer
        );

    }

    function update(){

        const element =
            document.getElementById(
                "countdown"
            );

        if(!element) return;

        let diff =
            target.getTime() -
            Date.now();

        if(diff <= 0){

            element.innerHTML =
                `<div class="empty">
                    🏁 ¡La carrera comenzó!
                 </div>`;

            return;

        }

        const days =
            Math.floor(
                diff /
                86400000
            );

        diff %= 86400000;

        const hours =
            Math.floor(
                diff /
                3600000
            );

        diff %= 3600000;

        const minutes =
            Math.floor(
                diff /
                60000
            );

        diff %= 60000;

        const seconds =
            Math.floor(
                diff /
                1000
            );

        element.innerHTML = `

            <div class="time-box">
                <div class="time-number">
                    ${days}
                </div>
                <div class="time-label">
                    DÍAS
                </div>
            </div>

            <div class="time-box">
                <div class="time-number">
                    ${hours}
                </div>
                <div class="time-label">
                    HORAS
                </div>
            </div>

            <div class="time-box">
                <div class="time-number">
                    ${minutes}
                </div>
                <div class="time-label">
                    MIN
                </div>
            </div>

            <div class="time-box">
                <div class="time-number">
                    ${seconds}
                </div>
                <div class="time-label">
                    SEG
                </div>
            </div>
        `;

    }

    update();

    state.countdownTimer =
        setInterval(
            update,
            1000
        );

}


/*
    =====================================================
    CALENDARIO
    =====================================================
*/

function renderCalendar(){

    const container =
        document.getElementById(
            "calendarContent"
        );

    const races =
        getRaces()
        .sort(
            (a,b) =>
                new Date(a.race) -
                new Date(b.race)
        );

    if(!races.length){

        container.innerHTML =
            emptyMessage(
                "No hay calendario disponible."
            );

        return;

    }

    container.innerHTML =
        races
        .map((race,index) => `

            <div class="calendar-item">

                <div class="round">
                    GP ${race.round || index + 1}
                </div>

                <div>

                    <div class="calendar-name">
                        ${escapeHtml(race.name)}
                    </div>

                    <div class="calendar-date">
                        ${formatDate(race.race)}
                    </div>

                </div>

                <div class="calendar-time">
                    ${formatTime(race.race)}
                </div>

            </div>

        `)
        .join("");

}


/*
    =====================================================
    CAMPEONATO
    =====================================================
*/

function renderStandings(){

    const sport =
        state.sport;

    const data =
        state.data?.[sport];

    if(!data){

        return;

    }

    const drivers =
        data.drivers || [];

    const teams =
        data.teams || [];

    document
        .getElementById("driversContent")
        .innerHTML =
        renderStandingList(
            drivers,
            "driver"
        );

    document
        .getElementById("teamsContent")
        .innerHTML =
        renderStandingList(
            teams,
            "team"
        );

}


function renderStandingList(
    list,
    type
){

    if(!list.length){

        return emptyMessage(
            "Clasificación no disponible."
        );

    }

    return list
        .slice(0,20)
        .map((item,index) => {

            const position =
                item.position ||
                index + 1;

            const name =
                item.name ||
                item.driver ||
                item.team ||
                "Sin nombre";

            const extra =
                item.team ||
                "";

            const points =
                item.points ??
                "-";

            return `

                <div class="standing">

                    <div class="pos">
                        ${position}
                    </div>

                    <div>

                        <div class="driver">
                            ${escapeHtml(name)}
                        </div>

                        ${
                            extra
                            ?
                            `<div class="team">
                                ${escapeHtml(extra)}
                             </div>`
                            :
                            ""
                        }

                    </div>

                    <div class="points">
                        ${points}
                    </div>

                </div>
            `;

        })
        .join("");

}


/*
    =====================================================
    NOTICIAS
    =====================================================
*/

async function loadNews(){

    const container =
        document.getElementById(
            "newsContent"
        );

    const domain =
        state.sport === "f1"
        ? "formula1.com"
        : "motogp.com";

    const url =
        "https://news.google.com/rss/search" +
        "?q=site%3A" +
        encodeURIComponent(domain) +
        "+when%3A7d" +
        "&hl=es-419" +
        "&gl=AR" +
        "&ceid=AR%3Aes-419";

    try{

        /*
           Google News RSS no siempre permite
           acceso directo desde GitHub Pages.

           Por eso usamos AllOrigins como proxy.
        */

        const proxy =
            "https://api.allorigins.win/raw?url=" +
            encodeURIComponent(url);

        const response =
            await fetch(
                proxy,
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "Noticias HTTP " +
                response.status
            );

        }

        const xml =
            await response.text();

        const parser =
            new DOMParser();

        const doc =
            parser.parseFromString(
                xml,
                "text/xml"
            );

        const items =
            [...doc.querySelectorAll(
                "item"
            )]
            .slice(0,15);

        if(!items.length){

            throw new Error(
                "Sin noticias"
            );

        }

        container.innerHTML =
            items
            .map(item => {

                const title =
                    item.querySelector(
                        "title"
                    )?.textContent ||
                    "Noticia";

                const link =
                    item.querySelector(
                        "link"
                    )?.textContent ||
                    "#";

                const date =
                    item.querySelector(
                        "pubDate"
                    )?.textContent ||
                    "";

                return `

                    <a
                        class="news"
                        href="${escapeAttribute(link)}"
                        target="_blank"
                        rel="noopener">

                        <div class="news-title">
                            ${escapeHtml(title)}
                        </div>

                        <div class="news-meta">
                            ${escapeHtml(date)}
                        </div>

                    </a>
                `;

            })
            .join("");

    }catch(error){

        console.error(
            "Noticias:",
            error
        );

        container.innerHTML =
            emptyMessage(
                "Las noticias no están disponibles en este momento."
            );

    }

}


/*
    =====================================================
    CALENDARIO ANDROID / ICS
    =====================================================
*/

function syncCalendar(){

    const races =
        getAllFutureRaces();

    if(!races.length){

        alert(
            "No hay carreras futuras para sincronizar."
        );

        return;

    }

    /*
       Si algún día lo convertimos en APK,
       AndroidBridge será usado aquí.

       En una web normal se descarga ICS.
    */

    if(
        window.AndroidBridge &&
        typeof window.AndroidBridge.syncCalendar ===
        "function"
    ){

        window.AndroidBridge.syncCalendar(
            JSON.stringify(races)
        );

        return;

    }

    const ics =
        createICS(races);

    const blob =
        new Blob(
            [ics],
            {
                type:
                    "text/calendar;charset=utf-8"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        "RacingHubAR-calendario.ics";

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);

    alert(
        "Calendario generado.\n\n" +
        "Incluye alarmas de 24 horas y 1 hora antes."
    );

}


function getAllFutureRaces(){

    if(!state.data){

        return [];

    }

    const result = [];

    for(const sport of ["f1","moto"]){

        const races =
            state.data?.[sport]?.races ||
            state.data?.[sport]?.events ||
            [];

        for(const race of races){

            if(!race.race){

                continue;

            }

            const date =
                new Date(race.race);

            if(
                !Number.isNaN(date.getTime()) &&
                date > new Date()
            ){

                result.push({

                    uid:
                        sport +
                        "-" +
                        (
                            race.id ||
                            race.round ||
                            race.name
                        ),

                    sport,

                    name:
                        race.name,

                    circuit:
                        race.circuit || "",

                    race:
                        race.race

                });

            }

        }

    }

    return result.sort(
        (a,b) =>
            new Date(a.race) -
            new Date(b.race)
    );

}


function createICS(events){

    const lines = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//Racing Hub AR//ES",
        "CALSCALE:GREGORIAN",
        "METHOD:PUBLISH"
    ];

    for(const event of events){

        const start =
            toICSDate(
                new Date(event.race)
            );

        const end =
            toICSDate(
                new Date(
                    new Date(event.race)
                    .getTime()
                    +
                    2 * 60 * 60 * 1000
                )
            );

        const title =
            event.sport === "f1"
            ? "🏎️ F1 · " + event.name
            : "🏍️ MotoGP · " + event.name;

        lines.push(
            "BEGIN:VEVENT",

            "UID:" +
            escapeICS(event.uid) +
            "@racinghubar",

            "DTSTAMP:" +
            toICSDate(
                new Date()
            ),

            "DTSTART:" +
            start,

            "DTEND:" +
            end,

            "SUMMARY:" +
            escapeICS(title),

            "DESCRIPTION:" +
            escapeICS(
                "Racing Hub AR · " +
                event.circuit +
                " · Hora de Argentina"
            ),

            "BEGIN:VALARM",
            "TRIGGER:-P1D",
            "ACTION:DISPLAY",
            "DESCRIPTION:" +
            escapeICS(
                "Mañana: " + title
            ),
            "END:VALARM",

            "BEGIN:VALARM",
            "TRIGGER:-PT1H",
            "ACTION:DISPLAY",
            "DESCRIPTION:" +
            escapeICS(
                "En 1 hora: " + title
            ),
            "END:VALARM",

            "END:VEVENT"
        );

    }

    lines.push(
        "END:VCALENDAR"
    );

    return lines.join("\r\n");

}

/*
    =====================================================
    FORMATO DE FECHAS
    =====================================================
*/

function formatDate(value){

    const date =
        new Date(value);

    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "Fecha no disponible";

    }

    return new Intl.DateTimeFormat(
        "es-AR",
        {
            timeZone:
                ARGENTINA_TZ,
            weekday:"long",
            day:"2-digit",
            month:"long",
            year:"numeric"
        }
    ).format(date);

}


function formatTime(value){

    const date =
        new Date(value);

    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "--:--";

    }

    return new Intl.DateTimeFormat(
        "es-AR",
        {
            timeZone:
                ARGENTINA_TZ,
            hour:"2-digit",
            minute:"2-digit",
            hour12:false
        }
    ).format(date) +
    " ART";

}


function formatDateTime(value){

    return (
        formatDate(value) +
        " · " +
        formatTime(value)
    );

}

                    <br><br>

                    </strong>

function emptyMessage(message){

    return `
        <div class="empty">
            ${escapeHtml(message)}
        </div>
    `;

}

*/

function setStatus(
    text,
    type
){

    const el =
        document.getElementById(
            "status"
        );

    el.textContent = text;

    el.className =
        "status " +
        (
            type === "ok"
            ? "ok"
            : type === "error"
            ? "error"
            : ""
        );

}


function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttribute(value){

    return escapeHtml(value);

}


function escapeICS(value){

    return String(
        value ?? ""
    )
    .replaceAll("\\","\\\\")
    .replaceAll(";","\\;")
    .replaceAll(",","\\,")
    .replaceAll("\n","\\n");

}


function toICSDate(date){

    return date
        .toISOString()
        .replaceAll("-","")
        .replaceAll(":","")
        .replace(".000","");

}
